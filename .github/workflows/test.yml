name: Tests

on:
  workflow_call:
    inputs:
      dist-artifact:
        description: 'Name of the artifact containing the distribution'
        required: true
        type: string
      python_minimal:
        description: 'Minimal set of Python versions to test'
        required: false
        type: string
        default: '["3.10", "3.14"]'
      python_full:
        description: 'Full set of Python versions to test'
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]'
      python_latest:
        description: 'Latest Python version'
        required: false
        type: string
        default: '3.14'

jobs:
  install_test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_full) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install from wheel
        uses: ./.github/actions/install-from-artifact
        with:
          artifact_in: ${{ inputs.dist-artifact }}
          python-version: ${{ matrix.python-version }}
      - name: Install project and test cli
        run: |
          dynaconf init -v FOO=running_on_ci -y
          dynaconf -i config.settings write toml -v OTHERVALUE=Hello_CI -y
          dynaconf -i config.settings list | grep -c running_on_ci
          dynaconf -i config.settings list | grep -c Hello_CI
          dynaconf --version

  unit_tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_minimal) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install from wheel
        uses: ./.github/actions/install-from-artifact
        with:
          artifact_in: ${{ inputs.dist-artifact }}
          python-version: ${{ matrix.python-version }}
          dependencies: test

      - name: Run unit tests
        shell: bash
        run: make test

      # Linux only: Windows and macOS runners don't have Docker available
      # for the redis/vault fixtures these tests depend on.
      - name: Run integration tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: make test-integration

      - name: Publish Junit Test Results
        if: always() && matrix.os == 'ubuntu-latest'
        uses: EnricoMi/publish-unit-test-result-action@v2
        continue-on-error: true
        with:
          files: junit/**/*.xml
          check_name: Test Results (Python ${{ matrix.python-version }})

      - name: "Upload coverage to Codecov"
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == inputs.python_latest
        uses: codecov/codecov-action@v7
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.xml
          fail_ci_if_error: true

  functional_tests:
    needs: [install_test, unit_tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_minimal) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install from wheel
        uses: ./.github/actions/install-from-artifact
        with:
          artifact_in: ${{ inputs.dist-artifact }}
          python-version: ${{ matrix.python-version }}
          dependencies: test
      - name: Run functional tests
        shell: bash
        run: make test-functional

  integration_test:
    needs: [install_test, unit_tests]
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_minimal) }}
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install from wheel
        uses: ./.github/actions/install-from-artifact
        with:
          artifact_in: ${{ inputs.dist-artifact }}
          python-version: ${{ matrix.python-version }}
          dependencies: test
      - name: Run Redis functional tests
        run: make test-redis
      - name: Run Vault functional tests
        run: make test-vault
